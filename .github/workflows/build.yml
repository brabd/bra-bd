name: Daily build & publish

on:
  push:
    branches: [main]
    paths: ['content/**', 'build.py']
  schedule:
    - cron: '15 3 * * *'   # প্রধান রান — প্রতিদিন 03:15 UTC = সকাল ৯:১৫ বাংলাদেশ সময়
    - cron: '15 4 * * *'   # ব্যাকআপ রান — GitHub-এর cron মাঝেমধ্যে মিস/দেরি করে; ১ ঘণ্টা পর একই কাজ আবার চেষ্টা করে (কিছু নতুন না থাকলে কমিট হয় না)
  workflow_dispatch:

concurrency:
  group: daily-build
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build site (publishes due scheduled articles)
        run: python build.py
      - name: Commit & push if changed
        run: |
          git config user.name "brabd"
          git config user.email "brabangladesh@gmail.com"
          git add site
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "auto-build: publish due articles [skip ci]"
            for i in 1 2 3; do
              git pull --rebase origin main && git push && break
              echo "push failed, retrying ($i)..."; sleep 5
            done
          fi
      - name: IndexNow ping
        run: python ping_indexnow.py
        continue-on-error: true
